name: Upload YouTube Shorts

on:
  schedule:
    - cron: "0 5 * * *"   # 10:00 AM PKT - UPLOAD ONLY
    - cron: "0 11 * * *"  # 4:00 PM PKT - UPLOAD ONLY
  workflow_dispatch:  # Keep this! Manual runs = Download ONLY

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Setup YouTube credentials
        run: echo '${{ secrets.YT_CLIENT_SECRETS }}' > client_secrets.json
      
      - name: Run bot
        run: python bot.py
      
      - name: Commit and push queue files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add upload_queue.json processed_videos.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update queue files [skip ci]"
          git push
