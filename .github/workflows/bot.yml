name: Auto Police Shorts Bot
on:
  workflow_dispatch:

jobs:
  upload-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show all files
        run: |
          echo "Current folder:"
          pwd
          echo "--- Files in repo ---"
          ls -la
          echo "--- Content of bot.py ---"
          cat bot.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install ffmpeg -y
          pip install yt-dlp moviepy google-api-python-client google-auth-oauthlib requests Pillow
      - name: Run bot
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python bot.py
