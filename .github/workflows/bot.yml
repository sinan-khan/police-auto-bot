name: Upload Shorts
on:
  schedule:
    - cron: "0 0 * * *"   # 5:00 AM PKT (assuming UTC+5)
    - cron: "0 3 * * *"   # 8:00 AM PKT (assuming UTC+5)
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install gdown google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - run: echo '${{ secrets.YT_TOKEN }}' > token.json
      - run: python bot.py
