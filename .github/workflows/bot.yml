name: Auto Police Shorts Bot

on:
  schedule:
    - cron: '0 9,21 * * *'  # 2pm & 2am Pakistan time
  workflow_dispatch:

jobs:
  upload-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install yt-dlp moviepy==1.0.3 google-api-python-client google-auth-oauthlib google-auth-httplib2 requests Pillow==9.5.0
      
      - name: Run bot
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python bot.py
