name: Auto Police Shorts Bot
on:
  schedule:
    - cron: '0 5,13 * * *' # 10:00 AM + 6:00 PM Pakistan time
  workflow_dispatch:

jobs:
  upload-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install ffmpeg -y
          pip install yt-dlp moviepy google-api-python-client google-auth-oauthlib requests Pillow
      - name: Run bot
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python bot.py
