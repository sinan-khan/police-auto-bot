name: Upload YouTube Shorts

on:
  schedule:
    # FIRST UPLOAD: US Evening Peak (8:00 PM EST) - Highest daily engagement
    # 8:00 PM EST = 6:00 AM PKT (next day)
    - cron: "0 6 * * *"   # Runs EVERY day at 6:00 AM PKT
    
    # SECOND UPLOAD: US Lunch/Afternoon Peak (12:00 PM EST)
    # 12:00 PM EST = 9:00 PM PKT (same day)
    - cron: "0 21 * * *"  # Runs EVERY day at 9:00 PM PKT

  workflow_dispatch:  # Manual trigger (Download mode only)

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Setup YouTube credentials
        run: echo '${{ secrets.YT_CLIENT_SECRETS }}' > client_secrets.json
      
      - name: Run bot
        run: python bot.py
      
      - name: Commit and push queue files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add upload_queue.json processed_videos.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update queue files [skip ci]"
          git push
