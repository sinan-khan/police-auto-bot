name: Download Videos

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        sudo apt-get update
        sudo apt-get install -y ffmpeg yt-dlp
    
    - name: Create directories
      run: |
        mkdir -p temp_videos
        mkdir -p output_clips
    
    - name: Create empty queue.json if not exists
      run: |
        if [ ! -f queue.json ]; then
          echo '{"pending_clips": [], "uploaded_clips": [], "next_part_number": 1}' > queue.json
          echo "✅ Created empty queue.json"
        else
          echo "✅ queue.json already exists"
        fi
    
    - name: Download videos and create clips
      run: python bot.py --mode download
      env:
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    
    - name: Save videos to cache
      uses: actions/cache/save@v3
      with:
        path: |
          temp_videos/
          queue.json
        key: video-cache-${{ github.run_id }}
    
    - name: Commit queue.json to repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        if [ -f queue.json ]; then
          git add queue.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update queue after download [skip ci]"
          git push
          echo "✅ queue.json committed"
        else
          echo "⚠️ queue.json not found - skipping commit"
        fi
    
    - name: Show queue status
      run: |
        echo "========== QUEUE STATUS =========="
        if [ -f queue.json ]; then
          echo "File exists. Contents:"
          cat queue.json
        else
          echo "❌ queue.json not found"
        fi
        echo "=================================="
