name: Download Videos

on:
  workflow_dispatch:  # Manual run only

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Create directories
      run: |
        mkdir -p temp_videos
        mkdir -p output_clips
    
    - name: Download videos and create clips
      run: python bot.py --mode download-only
    
    - name: Save videos to cache
      uses: actions/cache/save@v3
      with:
        path: |
          temp_videos/
          queue.json
        key: video-cache-${{ github.run_id }}
    
    - name: Commit queue.json to repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add queue.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update queue after download [skip ci]"
        git push
