name: Upload YouTube Shorts

on:
  schedule:
    # FIRST UPLOAD: US Evening Peak (8:00 PM EST) - Highest daily engagement
    # 8:00 PM EST = 6:00 AM PKT (next day)
    - cron: "0 6 * * *"   # Runs EVERY day at 6:00 AM PKT
    
    # SECOND UPLOAD: US Lunch/Afternoon Peak (12:00 PM EST)
    # 12:00 PM EST = 9:00 PM PKT (same day)
    - cron: "0 21 * * *"  # Runs EVERY day at 9:00 PM PKT

  workflow_dispatch:  # Manual trigger

jobs:
  upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Restore videos from cache
      uses: actions/cache/restore@v3
      with:
        path: |
          temp_videos/
          queue.json
        key: video-cache-
        restore-keys: |
          video-cache-
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Upload 1 video to YouTube
      run: python bot.py --mode upload --limit 1
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    
    - name: Save updated cache
      uses: actions/cache/save@v3
      with:
        path: |
          temp_videos/
          queue.json
        key: video-cache-${{ github.run_id }}
    
    - name: Commit queue changes to repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add queue.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update queue after upload [skip ci]"
        git push
    
    - name: Check remaining videos
      run: |
        if [ -f queue.json ]; then
          REMAINING=$(python -c "import json; f=open('queue.json'); q=json.load(f); print(len(q.get('pending_clips', [])))")
          echo "📊 Remaining videos in queue: $REMAINING"
          if [ $REMAINING -lt 10 ]; then
            echo "⚠️ Low on videos ($REMAINING remaining)! Run download workflow soon."
          fi
        fi
