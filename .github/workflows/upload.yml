name: Upload YouTube Shorts

on:
  schedule:
    # 5:00 AM PKT = 0:00 UTC
    - cron: "0 0 * * *"
    # 9:00 PM PKT = 16:00 UTC
    - cron: "0 16 * * *"

  workflow_dispatch:

permissions:
  contents: write   # needed to download/delete assets on the clip-queue release

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup YouTube credentials
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -z "$YT_TOKEN_JSON" ]; then
            echo "❌ YT_TOKEN_JSON secret is empty or not set"
            exit 1
          fi
          printf '%s' "$YT_TOKEN_JSON" > token.json
          python3 -c "import json; json.load(open('token.json'))" \
            && echo "✅ token.json is valid JSON" \
            || { echo "❌ token.json is not valid JSON — check the YT_TOKEN_JSON secret value"; exit 1; }

      - name: Run upload bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python upload_bot.py

      - name: Commit and push queue file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add upload_queue.json
          git diff --staged --quiet || git commit -m "Update queue files [skip ci]"
          git push
